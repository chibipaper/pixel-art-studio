name: Security regression and animation validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded dependency in runner
        run: python -m pip install --only-binary=:all: 'Pillow>=10.4,<12'
      - name: Static regression checks
        run: python -m unittest discover -s tests -v
      - name: Integration validator (checked-in scripts only)
        run: python scripts/validate_skill.py
